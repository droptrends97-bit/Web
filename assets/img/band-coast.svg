<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1100" viewBox="0 0 2400 1100" role="img" aria-label="Full-bleed band — placeholder">
  <rect width="2400" height="1100" fill="#4E5A60"/>
  <rect x="33" y="33" width="2334" height="1034" fill="none" stroke="#E9E2D3" stroke-opacity=".28" stroke-dasharray="6 6"/>
  <text x="66" y="98" font-family="ui-monospace, Menlo, monospace" font-size="32" font-weight="700" fill="#E9E2D3" letter-spacing="1">FULL-BLEED BAND</text>
  <text x="66" y="126.8" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#E9E2D3" opacity=".9">2400×1100  ·  band-coast.svg</text>
  <text x="66" y="149.2" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#E9E2D3" opacity=".72">Atmospheric, genuine Irish texture. Preferred: a signwritten trade van parked on a wet east-coast pier at dusk, or a harbour wall with hand-painted lettering. Landscape, low sun, no</text>
  <text x="66" y="179.2" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#E9E2D3" opacity=".72">people looking at camera, no stock-American contractors in hard hats. Dark enough to carry white type across the lower third.</text>
</svg>