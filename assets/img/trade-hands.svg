<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Trade portrait — placeholder">
  <rect width="1200" height="1500" fill="#4E5A60"/>
  <rect x="36" y="36" width="1128" height="1428" fill="none" stroke="#E9E2D3" stroke-opacity=".28" stroke-dasharray="6 6"/>
  <text x="72" y="107" font-family="ui-monospace, Menlo, monospace" font-size="35" font-weight="700" fill="#E9E2D3" letter-spacing="1">TRADE PORTRAIT</text>
  <text x="72" y="138.5" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#E9E2D3" opacity=".9">1200×1500  ·  trade-hands.svg</text>
  <text x="72" y="163" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#E9E2D3" opacity=".72">Portrait orientation. Hands and materials, not a face: a plasterer</text>
  <text x="72" y="196" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#E9E2D3" opacity=".72">trowelling, an electrician at a consumer unit, tiles being cut. Real dirt,</text>
  <text x="72" y="229" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#E9E2D3" opacity=".72">real Irish light, phone-camera honesty rather than studio gloss.</text>
</svg>